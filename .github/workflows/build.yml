name: Test & Build
on:
  push:
    branches:
      - master

  pull_request:

jobs:
  install-go-modules:
    strategy:
      matrix:
        go: ["1.27.x", "1.26.x"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test install Go modules for v${{ matrix.go }}
        run: go install -v . && chamber version

  test:
    strategy:
      matrix:
        go: ["1.27.x", "1.26.x"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: make test

      - name: Check modules are tidy and checked in
        run: |
          export GO111MODULE=on
          go mod tidy
          if [ "$(git status --porcelain)" != "" ]; then
            echo "git tree is dirty after tidying modules"
            echo "ensure go.mod and go.sum are tidy"
            git status
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: Run coverage
        run: make coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: segmentio/chamber

  dist:
    strategy:
      matrix:
        go: ["1.27.x", "1.26.x"]
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Install nfpm, rpmbuild
        run: sudo make -f Makefile.tools nfpm-debian rpmbuild-debian

      - name: Make distributables
        run: make -f Makefile.release dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.go }}
          path: "dist/*"

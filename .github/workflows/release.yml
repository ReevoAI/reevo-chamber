name: Release
# ECR-only release. The base version is tracked in the repo's VERSION file
# (bumped via PR); the -reevo.N fork suffix is computed automatically from the
# tags already in ECR. There is no version/tag input and no GitHub release.
on:
  workflow_dispatch:

jobs:
  publish-ecr:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Print the OIDC token's sub (and related claims) so the exact subject the
      # AWS trust policy must match is visible in the logs. Decodes the JWT payload
      # only -- it never prints the raw token.
      - name: Print OIDC sub claim
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          set -euo pipefail
          IDTOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')
          PAYLOAD=$(printf '%s' "$IDTOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          printf '%s' "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_id, repository_owner, repository_owner_id, ref, ref_type}'

      # AWS auth first, so a bad OIDC trust fails fast before the slow QEMU/Buildx
      # setup. Cap assume-role retries at 3 so auth failures surface quickly.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compute version and reevo build number
        id: version
        env:
          ECR_REPO: ${{ vars.ECR_REPO }}
        run: |
          set -euo pipefail

          # Base version is tracked in the VERSION file (bumped via PR). Strip any
          # leading v and surrounding whitespace.
          BASE="$(tr -d '[:space:]' < VERSION)"
          BASE="${BASE#v}"
          test -n "$BASE" || { echo "::error::VERSION file is empty"; exit 1; }

          # Must match the ECR_REPO default in Makefile.release.
          REPO="${ECR_REPO:-vendored/chamber}"

          # The immutable ECR tags are the source of truth for the counter: find the
          # highest existing <base>-reevo.N, then +1. When BASE changes, nothing
          # matches the prefix, so N resets to 1 automatically.
          # Fail loudly if the listing errors (e.g. missing ecr:ListImages or the
          # repo doesn't exist): silently defaulting to reevo.1 would collide under
          # an immutable tag policy. An existing-but-empty repo returns no tags (ok).
          if ! TAGS=$(aws ecr list-images \
                        --repository-name "$REPO" \
                        --filter tagStatus=TAGGED \
                        --query "imageIds[].imageTag" --output text 2>&1); then
            echo "::error::Could not list images for '$REPO' (needs ecr:ListImages and the repo must exist): $TAGS"
            exit 1
          fi
          MAX=$(printf '%s' "$TAGS" | tr '[:space:]' '\n' \
                  | sed -nE "s/^${BASE}-reevo\.([0-9]+)$/\1/p" \
                  | sort -n | tail -1)
          if [ -z "${MAX:-}" ]; then N=1; else N=$((MAX + 1)); fi

          echo "version=v${BASE}" >> "$GITHUB_OUTPUT"
          echo "fork_suffix=reevo.$N" >> "$GITHUB_OUTPUT"
          echo "Base ${BASE} -> ${BASE}-reevo.$N"

      - name: Build and push to ECR
        run: make -f Makefile.release publish-ecr
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORK_SUFFIX: ${{ steps.version.outputs.fork_suffix }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPO: ${{ vars.ECR_REPO }}
